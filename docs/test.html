<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay ₹99</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --accent: #c8f564;
    --text: #f0f0f0;
    --muted: #666;
    --border: #222;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* bg glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(200,245,100,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
    position: relative;
    animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    background: rgba(200,245,100,0.12);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1px solid rgba(200,245,100,0.2);
    margin-bottom: 24px;
  }

  .amount {
    font-family: 'Syne', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 6px;
  }

  .amount span {
    font-size: 36px;
    vertical-align: super;
    letter-spacing: 0;
  }

  .desc {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .upi-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 28px;
  }

  .upi-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #5f259f, #00b9f1);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  .upi-id {
    font-size: 13px;
    color: var(--muted);
    text-align: left;
    line-height: 1.4;
  }

  .upi-id strong {
    display: block;
    color: var(--text);
    font-size: 14px;
  }

  .pay-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    display: block;
  }

  .pay-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(200,245,100,0.25);
  }

  .pay-btn:active {
    transform: scale(0.97);
  }

  .pay-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  .apps-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 20px;
    opacity: 0.5;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .apps-row span { text-transform: uppercase; }

  #successMsg {
    display: none;
    margin-top: 20px;
    background: rgba(200,245,100,0.08);
    border: 1px solid rgba(200,245,100,0.2);
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    color: var(--accent);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">Secure Payment</div>

  <div class="amount"><span>₹</span>99</div>
  <div class="desc">One-time payment · Tap below to pay via any UPI app</div>

  <div class="upi-row">
    <div class="upi-icon">UPI</div>
    <div class="upi-id">
      <strong>9561445970@yescred</strong>
      Paying to this UPI ID
    </div>
  </div>

  <a class="pay-btn" id="payBtn" href="upi://pay?pa=9561445970@yescred&pn=Payment&am=99&cu=INR&tn=Order%20Payment" onclick="handlePay()">
    Pay ₹99 Now →
  </a>

  <div class="apps-row">
    <span>GPay</span>·<span>PhonePe</span>·<span>Paytm</span>·<span>BHIM</span>
  </div>

  <div id="successMsg">
    ✓ UPI app should open automatically.<br>
    Complete the payment there and you're done!
  </div>
</div>

<script>
  function handlePay() {
    setTimeout(() => {
      document.getElementById('successMsg').style.display = 'block';
    }, 800);
  }
</script>

</body>
</html>
