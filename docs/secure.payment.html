<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout · Secure Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1120;
    --ink-soft:#141B2E;
    --paper:#F5F6FA;
    --card:#FFFFFF;
    --line:#E3E6F1;
    --muted:#6B7280;
    --mint:#00C9A7;
    --mint-dark:#00A98B;
    --amber:#FF8A3D;
    --danger:#E5484D;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;}

  /* ---------- Layout ---------- */
  .page{
    min-height:100vh;
  }
  .form-side{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:48px 24px;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px 32px;
    box-shadow:0 20px 50px rgba(15,23,42,0.06);
  }
  .card-eyebrow{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    margin-bottom:6px;
  }
  .card h1{
    font-size:26px;
    margin:0 0 28px 0;
    font-weight:700;
  }

  .field{
    margin-bottom:18px;
    position:relative;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field .req{color:var(--amber);}
  .field input{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{color:#B4B9C9;}
  .field input:focus{
    border-color:var(--mint);
    box-shadow:0 0 0 4px rgba(0,201,167,0.12);
  }
  .field input:disabled{
    background:#F1F3F8;
    color:#5B6478;
    border-color:var(--line);
  }
  .field input.invalid{border-color:var(--danger);}
  .field .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:5px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .pin-wrap{position:relative;}
  .pin-spinner{
    position:absolute;
    right:14px;top:38px;
    width:16px;height:16px;
    border:2px solid #D7DBE8;
    border-top-color:var(--mint);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .pin-spinner.show{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .in-input-edit{position:relative;}
  .in-input-edit input{padding-right:42px;}
  .field-edit-btn{
    position:absolute;
    right:6px;
    top:34px;
    width:28px;height:28px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .field-edit-btn:hover{background:#EEF0F6;color:var(--mint-dark);}
  .field-edit-btn.editing{color:var(--mint-dark);background:#E7F9F4;}
  .field-edit-btn svg{width:14px;height:14px;}
  .field-edit-btn .icon-pencil{display:block;}
  .field-edit-btn .icon-check{display:none;}
  .field-edit-btn.editing .icon-pencil{display:none;}
  .field-edit-btn.editing .icon-check{display:block;}

  .summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#F1FBF8;
    border:1px solid #CDEEE5;
    border-radius:12px;
    padding:14px 16px;
    margin:22px 0 20px 0;
  }
  .summary .label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .summary .amount{font-family:'Manrope',sans-serif;font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}

  .pay-btn{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:none;
    background:#C7CBD8;
    color:#8890A3;
    font-family:'Manrope',sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:not-allowed;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .2s ease, color .2s ease, transform .1s ease, box-shadow .2s ease;
  }
  .pay-btn.active{
    background:linear-gradient(135deg,var(--mint),var(--mint-dark));
    color:#fff;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,169,139,0.35);
  }
  .pay-btn.active:hover{transform:translateY(-1px);}
  .pay-btn.active:active{transform:translateY(0px);}
  .pay-btn svg{width:17px;height:17px;}

  .secure-note{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:11.5px;
    color:var(--muted);
    margin-top:14px;
  }
  .secure-note svg{width:13px;height:13px;color:var(--mint-dark);}

  /* ---------- Overlay + Bottom Sheet ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(6,10,20,0.55);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:460px;
    margin:0 auto;
    background:var(--card);
    border-radius:22px 22px 0 0;
    box-shadow:0 -20px 60px rgba(0,0,0,0.3);
    transform:translateY(105%);
    transition:transform .35s cubic-bezier(.32,.72,0,1);
    z-index:50;
    max-height:92vh;
    overflow-y:auto;
    padding:10px 24px 26px 24px;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:40px;height:4px;
    background:#E1E4EF;
    border-radius:99px;
    margin:8px auto 14px auto;
  }

  .sheet-timerbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#FFF4EC;
    border:1px solid #FFDEC2;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:18px;
  }
  .sheet-timerbar .tlabel{font-size:12px;color:#9A5A22;font-weight:600;}
  .sheet-timerbar .tval{
    font-family:'Manrope',sans-serif;
    font-size:17px;font-weight:700;color:var(--amber);
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }

  .pay-total{text-align:center;margin-bottom:4px;}
  .pay-total .plabel{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
  .pay-total .pval{font-family:'Manrope',sans-serif;font-size:30px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
  .order-id{text-align:center;font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:18px;}
  .order-id span{font-weight:600;color:var(--ink-soft);}

  .scan-label{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:14px;
    letter-spacing:0.02em;
  }

  .qr-ring-wrap{
    position:relative;
    width:200px;height:200px;
    margin:0 auto 18px auto;
    display:flex;align-items:center;justify-content:center;
  }
  .qr-ring{position:absolute;top:0;left:0;width:200px;height:200px;transform:rotate(-90deg);}
  .qr-ring circle{fill:none;stroke-width:4;}
  .qr-ring .bg{stroke:#EEF0F6;}
  .qr-ring .fg{
    stroke:var(--mint);
    stroke-linecap:round;
    stroke-dasharray:565.48;
    stroke-dashoffset:0;
    transition:stroke-dashoffset 1s linear;
  }
  .qr-box{
    width:168px;height:168px;
    background:#fff;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(15,23,42,0.08);
  }
  .qr-box img{width:100%;height:100%;object-fit:contain;}
  .qr-fallback{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#B4B9C9;
    font-size:11px;
    text-align:center;
    padding:10px;
  }
  .qr-fallback svg{width:44px;height:44px;}

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:6px 0 4px 0;
  }
  .spinner-sm{
    width:16px;height:16px;
    border:2.5px solid #E1E4EF;
    border-top-color:var(--mint);
    border-radius:50%;
    animation:spin .8s linear infinite;
    flex-shrink:0;
  }
  .status-text{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .status-sub{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .dot{opacity:0.3;animation:pulse 1.4s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes pulse{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  .cancel-btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    color:#6B7280;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .cancel-btn:hover{
    background:#FFF3F3;
    border-color:#F5C6C7;
    color:var(--danger);
  }

  .upi-apps{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:16px 0 20px 0;
  }
  .upi-chip{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    background:#F5F6FA;
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:99px;
  }

  @media (max-width:920px){
    .form-side{padding:32px 20px 60px 20px;}
    .card{padding:28px 22px;}
  }
</style>
</head>
<body>

<div class="page">

  <!-- Form -->
  <div class="form-side">
    <div class="card">
      <div class="card-eyebrow">Checkout</div>
      <h1>Delivery Details</h1>

      <form id="checkoutForm" autocomplete="off" novalidate>

        <div class="field">
          <label for="name">Full name <span class="req">*</span></label>
          <input type="text" id="name" placeholder="Aarav Sharma" required>
        </div>

        <div class="row2">
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="phone">Phone <span class="req">*</span></label>
            <input type="tel" id="phone" placeholder="98765 43210" maxlength="10" inputmode="numeric" required>
          </div>
        </div>

        <div class="field">
          <label for="address">Address <span class="req">*</span></label>
          <input type="text" id="address" placeholder="House no., street, locality" required>
        </div>

        <div class="row2">
          <div class="field pin-wrap">
            <label for="pincode">Pincode <span class="req">*</span></label>
            <input type="text" id="pincode" placeholder="411001" maxlength="6" inputmode="numeric" required>
            <span class="pin-spinner" id="pinSpinner"></span>
            <div class="hint" id="pinHint">6-digit PIN auto-fills city &amp; state</div>
          </div>
          <div class="field in-input-edit">
            <label for="city">City <span class="req">*</span></label>
            <input type="text" id="city" placeholder="City" required disabled>
            <button type="button" class="field-edit-btn" id="cityEditBtn" aria-label="Edit city" title="Edit">
              <svg class="icon-pencil" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="icon-check" viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="field in-input-edit">
          <label for="state">State <span class="req">*</span></label>
          <input type="text" id="state" placeholder="State" required disabled>
          <button type="button" class="field-edit-btn" id="stateEditBtn" aria-label="Edit state" title="Edit">
            <svg class="icon-pencil" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-check" viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="summary">
          <div>
            <div class="label">Order total</div>
          </div>
          <div class="amount" id="totalAmountDisplay">₹149</div>
        </div>

        <button type="button" class="pay-btn" id="payBtn" disabled>
          <!--<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/></svg>-->
          <img src="upilogo.png" width="15%" height="auto">
          Pay Now
        </button>

        <div class="secure-note">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6"/></svg>
          Your payment information is 256-bit encrypted.
        </div>
      </form>
    </div>
  </div>

</div>

<!-- Overlay + Bottom Sheet Payment Popup -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>

  <div class="sheet-timerbar">
    <span class="tlabel">Complete payment within</span>
    <span class="tval" id="timerVal">05:00</span>
  </div>

  <div class="pay-total">
    <div class="plabel">Amount payable</div>
    <div class="pval" id="sheetAmount">₹149</div>
  </div>
  <div class="order-id">Order ID: <span id="orderIdVal">—</span></div>

  <div class="scan-label">Scan To Pay</div>

  <div class="qr-ring-wrap">
    <svg class="qr-ring" id="qrRing" viewBox="0 0 200 200">
      <circle class="bg" cx="100" cy="100" r="90"></circle>
      <circle class="fg" id="qrRingFg" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="qr-box">
      <!-- Replace src below with your uploaded QR image -->
      <img id="qrImage" src="upiqr.png" alt="UPI QR Code" onerror="this.style.display='none'; document.getElementById('qrFallback').style.display='flex';">
      <div class="qr-fallback" id="qrFallback">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.6"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="currentColor"/></svg>
        QR image will appear here
      </div>
    </div>
  </div>

  <div class="upi-apps">
<!--    <span class="upi-chip">GPay</span>
    <span class="upi-chip">PhonePe</span>
    <span class="upi-chip">Paytm</span>
    <span class="upi-chip">BHIM</span>-->
 <img src="upiappslogo.png" width="50%" height="auto">
  </div>

  <div class="status-row">
    <div class="spinner-sm"></div>
    <div class="status-text">Payment Status Checking<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  </div>
  <div class="status-sub">Do not close or refresh this page</div>

  <button class="cancel-btn" id="cancelBtn">Cancel Payment</button>
</div>

<script>
  // ---------- Config ----------
  const TOTAL_AMOUNT = 2499; // demo order amount
  const REDIRECT_ON_TIMEOUT = "failed.html";
  const REDIRECT_ON_CANCEL = "failed.html";
  const SESSION_SECONDS = 5 * 60;

  const fmt = n => "₹" + n.toLocaleString("en-IN");
  document.getElementById("totalAmountDisplay").textContent = fmt(TOTAL_AMOUNT);
  document.getElementById("sheetAmount").textContent = fmt(TOTAL_AMOUNT);

  // ---------- Form fields ----------
  const form = document.getElementById("checkoutForm");
  const nameEl = document.getElementById("name");
  const emailEl = document.getElementById("email");
  const phoneEl = document.getElementById("phone");
  const addressEl = document.getElementById("address");
  const pincodeEl = document.getElementById("pincode");
  const cityEl = document.getElementById("city");
  const stateEl = document.getElementById("state");
  const pinSpinner = document.getElementById("pinSpinner");
  const pinHint = document.getElementById("pinHint");
  const cityEditBtn = document.getElementById("cityEditBtn");
  const stateEditBtn = document.getElementById("stateEditBtn");
  const payBtn = document.getElementById("payBtn");

  phoneEl.addEventListener("input", () => {
    phoneEl.value = phoneEl.value.replace(/\D/g, "").slice(0, 10);
    validateForm();
  });
  pincodeEl.addEventListener("input", () => {
    pincodeEl.value = pincodeEl.value.replace(/\D/g, "").slice(0, 6);
    validateForm();
    if (pincodeEl.value.length === 6) {
      lookupPincode(pincodeEl.value);
    } else {
      cityEl.value = "";
      stateEl.value = "";
    }
  });

  [nameEl, emailEl, addressEl].forEach(el => el.addEventListener("input", validateForm));
  cityEl.addEventListener("input", validateForm);
  stateEl.addEventListener("input", validateForm);

  function toggleFieldEdit(inputEl, btnEl) {
    const nowEditing = inputEl.disabled; // was disabled -> becomes editable
    inputEl.disabled = !nowEditing;
    btnEl.classList.toggle("editing", nowEditing);
    btnEl.title = nowEditing ? "Done" : "Edit";
    btnEl.setAttribute("aria-label", nowEditing ? "Done editing" : "Edit");
    if (nowEditing) inputEl.focus();
    validateForm();
  }

  cityEditBtn.addEventListener("click", () => toggleFieldEdit(cityEl, cityEditBtn));
  stateEditBtn.addEventListener("click", () => toggleFieldEdit(stateEl, stateEditBtn));

  async function lookupPincode(pin) {
    pinSpinner.classList.add("show");
    pinHint.textContent = "Looking up city & state…";
    try {
      const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
      const data = await res.json();
      if (data && data[0] && data[0].Status === "Success" && data[0].PostOffice && data[0].PostOffice.length) {
        const po = data[0].PostOffice[0];
        cityEl.value = po.District || po.Block || po.Name || "";
        stateEl.value = po.State || "";
        pinHint.textContent = "City & state auto-filled — tap the pencil to edit";
        // re-lock fields in case they were left open from a previous manual edit
        cityEl.disabled = true;
        stateEl.disabled = true;
        cityEditBtn.classList.remove("editing");
        stateEditBtn.classList.remove("editing");
      } else {
        pinHint.textContent = "Couldn't auto-detect. Enter city & state manually.";
        cityEl.disabled = false;
        stateEl.disabled = false;
        cityEditBtn.classList.add("editing");
        stateEditBtn.classList.add("editing");
      }
    } catch (e) {
      pinHint.textContent = "Couldn't auto-detect. Enter city & state manually.";
      cityEl.disabled = false;
      stateEl.disabled = false;
      cityEditBtn.classList.add("editing");
      stateEditBtn.classList.add("editing");
    } finally {
      pinSpinner.classList.remove("show");
      validateForm();
    }
  }

  function validateForm() {
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim());
    const phoneOk = /^\d{10}$/.test(phoneEl.value.trim());
    const pinOk = /^\d{6}$/.test(pincodeEl.value.trim());
    const allOk = nameEl.value.trim().length > 1 &&
                  emailOk &&
                  phoneOk &&
                  addressEl.value.trim().length > 4 &&
                  pinOk &&
                  cityEl.value.trim().length > 1 &&
                  stateEl.value.trim().length > 1;

    payBtn.disabled = !allOk;
    payBtn.classList.toggle("active", allOk);
    return allOk;
  }

  // ---------- Payment sheet ----------
  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");
  const timerVal = document.getElementById("timerVal");
  const orderIdVal = document.getElementById("orderIdVal");
  const qrRingFg = document.getElementById("qrRingFg");
  const cancelBtn = document.getElementById("cancelBtn");

  const RING_CIRC = 2 * Math.PI * 90; // ≈565.48
  let countdownInterval = null;
  let secondsLeft = SESSION_SECONDS;

  function generateOrderId() {
    const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
    return "ORD" + Date.now().toString().slice(-6) + rand;
  }

  // Generate once per page load/refresh
  const currentOrderId = generateOrderId();
  orderIdVal.textContent = currentOrderId;

  function openSheet() {
    orderIdVal.textContent = currentOrderId;
    secondsLeft = SESSION_SECONDS;
    updateTimerDisplay();
    overlay.classList.add("show");
    sheet.classList.add("show");
    document.body.style.overflow = "hidden";

    countdownInterval = setInterval(() => {
      secondsLeft--;
      updateTimerDisplay();
      if (secondsLeft <= 0) {
        clearInterval(countdownInterval);
        window.location.href = REDIRECT_ON_TIMEOUT;
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(secondsLeft / 60).toString().padStart(2, "0");
    const s = (secondsLeft % 60).toString().padStart(2, "0");
    timerVal.textContent = `${m}:${s}`;
    const progress = secondsLeft / SESSION_SECONDS;
    qrRingFg.style.strokeDashoffset = RING_CIRC * (1 - progress);
  }

  function closeSheet() {
    clearInterval(countdownInterval);
    overlay.classList.remove("show");
    sheet.classList.remove("show");
    document.body.style.overflow = "";
  }

  payBtn.addEventListener("click", () => {
    if (!validateForm()) return;
    openSheet();
  });

  cancelBtn.addEventListener("click", () => {
    window.location.href = REDIRECT_ON_CANCEL;
  });

  // Popup stays open on outside tap — must use Cancel Payment or wait for timeout/redirect

  // init ring
  qrRingFg.style.strokeDasharray = RING_CIRC;
  qrRingFg.style.strokeDashoffset = 0;

  validateForm();
</script>

</body>
</html>
